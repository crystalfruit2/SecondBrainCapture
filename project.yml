name: SecondBrainCapture
options:
  bundleIdPrefix: com.alp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only
targets:
  SecondBrainCapture:
    type: application
    platform: iOS
    sources:
      - path: SecondBrainCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alp.SecondBrainCapture
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3KQT8N29A9
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used to record your voice notes."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Used to transcribe your voice notes into text."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
